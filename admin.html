<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sungomi — 관리자</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
  />
  <link rel="stylesheet" href="./styles.css?v=6" />
  <link rel="stylesheet" href="./admin.css?v=6" />
</head>
<body class="admin-body admin-locked">
  <!-- 비밀번호 잠금 화면 -->
  <div class="auth-gate" id="authGate" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <form class="auth-card" id="authForm">
      <div class="auth-icon">🔒</div>
      <h1 id="authTitle">관리자 인증</h1>
      <p class="auth-desc">비밀번호를 입력하세요.</p>
      <input
        type="password"
        id="authInput"
        class="adm-input auth-input"
        placeholder="••••"
        inputmode="numeric"
        autocomplete="current-password"
        autofocus
        required
      />
      <p class="auth-error" id="authError" hidden>비밀번호가 올바르지 않습니다.</p>
      <div class="auth-actions">
        <a href="./index.html" class="adm-btn">← 사이트</a>
        <button type="submit" class="adm-btn primary">확인</button>
      </div>
    </form>
  </div>

  <!-- 간결한 상단 헤더 -->
  <header class="admin-header">
    <div class="admin-header-left">
      <a href="./index.html" class="back-btn">← 사이트</a>
      <span class="admin-title">관리자</span>
    </div>

    <div class="admin-header-actions">
      <button class="adm-btn" id="siteSettingsBtn">설정</button>
      <button class="adm-btn" id="exportJsBtn" title="GitHub에 올릴 projects.js 파일 다운로드">
        projects.js 다운로드
      </button>
      <button class="adm-btn ghost" id="lockAdminBtn" title="잠금">잠금</button>
    </div>
  </header>

  <main class="admin-shell">
    <!-- 좌측: 항목 목록 -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-count" id="sidebarCount">전체 0</div>
        <button class="adm-btn small primary" id="newPostBtn">+ 추가</button>
      </div>

      <input
        type="search"
        id="listSearchInput"
        class="adm-input"
        placeholder="검색..."
      />

      <div class="status-tabs" id="statusTabs" role="tablist">
        <button type="button" class="status-tab active" data-status="all">전체</button>
        <button type="button" class="status-tab" data-status="published">공개</button>
        <button type="button" class="status-tab" data-status="hidden">숨김</button>
      </div>

      <div class="post-list" id="postList"></div>
    </aside>

    <!-- 우측: 깔끔한 편집기 -->
    <section class="editor" id="editorPanel">
      <div class="editor-bar">
        <div class="editor-bar-left">
          <label class="switch-wrap" title="메인 페이지 공개 여부">
            <input type="checkbox" id="fieldVisibleToggle" checked />
            <span class="switch-track"></span>
            <span class="switch-label" id="visibleLabel">공개 중</span>
          </label>
          <span class="save-indicator" id="saveIndicator">자동 저장됨</span>
        </div>

        <div class="editor-bar-right">
          <button type="button" class="adm-btn small" id="duplicatePostBtn">복제</button>
          <button type="button" class="adm-btn small danger-ghost" id="deletePostBtn">삭제</button>
          <button type="button" class="adm-btn small primary" id="savePostBtn">저장</button>
        </div>
      </div>

      <form id="postForm" class="editor-body" onsubmit="return false;">
        <!-- 대표 이미지 -->
        <div class="block">
          <div class="block-head">
            <h2>대표 이미지</h2>
            <label class="adm-btn small file-label">
              이미지 선택
              <input type="file" id="imageFileInput" accept="image/*" hidden />
            </label>
          </div>

          <div class="media-preview">
            <img id="editorPreviewImage" alt="미리보기" hidden />
            <video id="editorPreviewVideo" autoplay muted loop playsinline hidden></video>
            <iframe id="editorPreviewIframe" allow="autoplay; encrypted-media" hidden></iframe>
            <div class="preview-empty" id="editorPreviewEmpty">이미지가 없습니다</div>
          </div>

          <input
            type="text"
            id="fieldImageUrl"
            class="adm-input"
            placeholder="이미지 경로 (예: ./images/nooptoken.png)"
          />

          <details class="optional-box">
            <summary>영상 URL 추가 (선택)</summary>
            <div class="optional-inner">
              <input
                type="text"
                id="fieldVideoUrl"
                class="adm-input"
                placeholder="YouTube 또는 MP4 URL (비워두면 대표 이미지 표시)"
              />
              <button type="button" class="adm-btn small danger-ghost" id="clearVideoBtn">비우기</button>
            </div>
          </details>
        </div>

        <!-- 기본 정보 -->
        <div class="block">
          <h2>기본 정보</h2>
          <div class="grid-title">
            <div class="field">
              <label for="fieldTitle">제목</label>
              <input type="text" id="fieldTitle" class="adm-input" placeholder="예: NoopToken" required />
            </div>
            <div class="field">
              <label for="fieldCategory">분류</label>
              <select id="fieldCategory" class="adm-select">
                <option value="program">앱 (APP)</option>
                <option value="game">게임 (GAME)</option>
                <option value="webapp">웹 (WEB)</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="fieldTagline">한 줄 소개</label>
            <input type="text" id="fieldTagline" class="adm-input" placeholder="핵심 기능을 한 줄로 입력" />
          </div>

          <div class="field">
            <label for="fieldDescription">상세 설명</label>
            <textarea
              id="fieldDescription"
              class="adm-textarea"
              rows="4"
              placeholder="상세 내용을 간결하게 입력하세요."
            ></textarea>
          </div>

          <div class="field">
            <label for="tagInput">태그 (Enter로 추가)</label>
            <div class="tag-editor">
              <div class="tag-chips" id="tagChips"></div>
              <input type="text" id="tagInput" placeholder="예: macOS, Windows, Rust" />
            </div>
          </div>
        </div>

        <!-- 링크 & 스펙 -->
        <div class="block">
          <div class="block-head">
            <h2>다운로드 / 실행 링크</h2>
            <button type="button" class="adm-btn small" id="addLinkBtn">+ 링크 추가</button>
          </div>
          <div class="dynamic-list" id="linksBuilder"></div>
        </div>

        <div class="block">
          <div class="block-head">
            <h2>스펙 정보</h2>
            <button type="button" class="adm-btn small" id="addStatBtn">+ 항목 추가</button>
          </div>
          <div class="dynamic-list" id="statsBuilder"></div>
        </div>
      </form>
    </section>
  </main>

  <!-- 설정 모달 (사이트 정보 + 데이터 관리 통합) -->
  <div class="liquid-modal-backdrop" id="settingsBackdrop" aria-hidden="true">
    <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-header">
        <h2 id="settingsTitle">사이트 설정</h2>
        <button class="icon-btn small" id="closeSettingsBtn" aria-label="닫기">✕</button>
      </div>

      <div class="settings-body">
        <div class="field">
          <label for="cfgBrandName">사이트 이름</label>
          <input type="text" id="cfgBrandName" class="adm-input" />
        </div>
        <div class="field">
          <label for="cfgHeroTitle">메인 제목</label>
          <input type="text" id="cfgHeroTitle" class="adm-input" />
        </div>
        <div class="field">
          <label for="cfgHeroSubtitle">부제목</label>
          <input type="text" id="cfgHeroSubtitle" class="adm-input" />
        </div>
        <div class="field">
          <div class="block-head">
            <label>상단 링크</label>
            <button type="button" class="adm-btn small" id="addCfgLinkBtn">+ 추가</button>
          </div>
          <div class="dynamic-list" id="cfgLinksBuilder"></div>
        </div>

        <div class="settings-divider"></div>

        <div class="field">
          <label>데이터 관리</label>
          <div class="data-tools">
            <button type="button" class="adm-btn small" id="exportJsonBtn">JSON 백업</button>
            <label class="adm-btn small file-label">
              JSON 복원
              <input type="file" id="importJsonInput" accept=".json,application/json" hidden />
            </label>
            <button type="button" class="adm-btn small danger-ghost" id="resetDefaultBtn">수정 취소 (초기화)</button>
          </div>
        </div>
      </div>

      <div class="settings-footer">
        <button type="button" class="adm-btn primary" id="saveSettingsBtn">저장</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="./projects.js?v=6"></script>
  <script src="./media-store.js?v=6"></script>
  <script src="./admin.js?v=6"></script>
</body>
</html>
