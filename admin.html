<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sungomi — 관리자</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
  />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./admin.css" />
</head>
<body class="admin-body">
  <header class="admin-header">
    <div class="admin-header-left">
      <a href="./index.html" class="back-btn">← 사이트로</a>
      <div class="admin-brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>관리자</span>
      </div>
    </div>

    <div class="admin-header-actions">
      <button class="adm-btn primary" id="newPostBtn">+ 새 항목</button>
      <button class="adm-btn" id="siteSettingsBtn">사이트 설정</button>
      <button class="adm-btn accent" id="exportJsBtn" title="GitHub Pages 반영용 projects.js 다운로드">
        projects.js 내보내기
      </button>
      <button class="adm-btn" id="exportJsonBtn">백업</button>
      <label class="adm-btn file-label">
        복원
        <input type="file" id="importJsonInput" accept=".json,application/json" hidden />
      </label>
      <button class="adm-btn danger-ghost" id="resetDefaultBtn">초기화</button>
    </div>
  </header>

  <main class="admin-container">
    <!-- 요약 -->
    <section class="kpi-grid" aria-label="요약">
      <div class="kpi-card">
        <span class="kpi-label">전체</span>
        <strong class="kpi-value" id="kpiTotal">0</strong>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">공개 중</span>
        <strong class="kpi-value blue" id="kpiPublished">0</strong>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">숨김</span>
        <strong class="kpi-value muted" id="kpiHidden">0</strong>
      </div>
    </section>

    <!-- 2단 워크스페이스 -->
    <div class="admin-workspace">
      <!-- 좌측 목록 -->
      <aside class="sidebar-panel">
        <div class="sidebar-top">
          <input
            type="search"
            id="listSearchInput"
            class="adm-input"
            placeholder="제목, 태그 검색..."
          />
          <div class="sidebar-filters">
            <select id="listStatusFilter" class="adm-select" aria-label="공개 상태 필터">
              <option value="all">상태: 전체</option>
              <option value="published">공개만</option>
              <option value="hidden">숨김만</option>
            </select>
            <select id="listCategoryFilter" class="adm-select" aria-label="카테고리 필터">
              <option value="all">분류: 전체</option>
              <option value="program">앱</option>
              <option value="game">게임</option>
              <option value="webapp">웹</option>
            </select>
          </div>
          <p class="sidebar-hint">드래그 또는 ▲▼로 순서 변경 · 눈 버튼으로 즉시 숨기기/보이기</p>
        </div>

        <div class="post-list" id="postList"></div>
      </aside>

      <!-- 우측 에디터 -->
      <section class="editor-panel" id="editorPanel">
        <div class="editor-header">
          <div class="editor-status-wrap">
            <span class="status-pill" id="editorStatusPill">공개 중</span>
            <span class="save-indicator" id="saveIndicator">저장됨</span>
          </div>
          <div class="editor-header-btns">
            <button type="button" class="adm-btn" id="toggleHideBtn">숨기기</button>
            <button type="button" class="adm-btn" id="duplicatePostBtn">복제</button>
            <button type="button" class="adm-btn danger-ghost" id="deletePostBtn">삭제</button>
            <button type="button" class="adm-btn primary" id="savePostBtn">저장</button>
          </div>
        </div>

        <form id="postForm" class="editor-form" onsubmit="return false;">
          <!-- 1. 기본 정보 -->
          <div class="form-section">
            <h2 class="section-title">기본 정보</h2>
            <div class="form-grid-2">
              <div class="field">
                <label for="fieldTitle">제목 *</label>
                <input type="text" id="fieldTitle" class="adm-input" placeholder="예: NoopToken" required />
              </div>
              <div class="field">
                <label for="fieldId">ID</label>
                <input type="text" id="fieldId" class="adm-input" placeholder="nooptoken" />
              </div>
            </div>

            <div class="form-grid-3">
              <div class="field">
                <label for="fieldCategory">카테고리</label>
                <select id="fieldCategory" class="adm-select">
                  <option value="program">앱</option>
                  <option value="game">게임</option>
                  <option value="webapp">웹</option>
                </select>
              </div>
              <div class="field">
                <label for="fieldCategoryLabel">배지 라벨</label>
                <input type="text" id="fieldCategoryLabel" class="adm-input" placeholder="PROGRAM, WEB GAME" />
              </div>
              <div class="field">
                <label for="fieldStatus">공개 여부</label>
                <select id="fieldStatus" class="adm-select">
                  <option value="published">공개 (메인에 표시)</option>
                  <option value="draft">숨김 (비공개)</option>
                </select>
              </div>
            </div>
          </div>

          <!-- 2. 소개 -->
          <div class="form-section">
            <h2 class="section-title">소개</h2>
            <div class="field">
              <label for="fieldTagline">한 줄 소개</label>
              <input
                type="text"
                id="fieldTagline"
                class="adm-input"
                placeholder="핵심 기능을 한 줄로 입력하세요."
              />
            </div>

            <div class="field">
              <div class="md-header">
                <label for="fieldDescription">상세 설명 (마크다운 지원)</label>
                <div class="md-tabs">
                  <button type="button" class="md-tab active" data-mode="write">작성</button>
                  <button type="button" class="md-tab" data-mode="preview">미리보기</button>
                </div>
              </div>
              <div class="md-toolbar" id="mdToolbar">
                <button type="button" class="md-tool-btn" data-wrap="**"><b>B</b></button>
                <button type="button" class="md-tool-btn" data-wrap="*"><i>I</i></button>
                <button type="button" class="md-tool-btn" data-wrap="`">코드</button>
                <button type="button" class="md-tool-btn" data-link="true">링크</button>
                <span class="char-count" id="descCharCount">0자</span>
              </div>
              <textarea
                id="fieldDescription"
                class="adm-textarea"
                rows="5"
                placeholder="주요 기능과 지원 환경을 간결하게 작성하세요."
              ></textarea>
              <div class="md-preview-box" id="mdPreviewBox" hidden></div>
            </div>
          </div>

          <!-- 3. 대표 이미지 및 영상 -->
          <div class="form-section">
            <h2 class="section-title">대표 이미지 · 영상</h2>

            <div class="field">
              <label for="fieldImageUrl">대표 이미지 경로 또는 URL</label>
              <div class="input-with-btn">
                <input
                  type="text"
                  id="fieldImageUrl"
                  class="adm-input"
                  placeholder="./images/example.png 또는 https://..."
                />
                <label class="adm-btn file-label">
                  이미지 업로드
                  <input type="file" id="imageFileInput" accept="image/*" hidden />
                </label>
              </div>
            </div>

            <div class="field">
              <label for="fieldVideoUrl">영상 URL / YouTube (선택 · 비워두면 대표 이미지 표시)</label>
              <div class="input-with-btn">
                <input
                  type="text"
                  id="fieldVideoUrl"
                  class="adm-input"
                  placeholder="https://youtube.com/watch?v=... 또는 ./videos/demo.mp4"
                />
                <button type="button" class="adm-btn danger-ghost" id="clearVideoBtn">영상 비우기</button>
              </div>
            </div>

            <div class="editor-media-preview">
              <img id="editorPreviewImage" alt="미리보기" hidden />
              <video id="editorPreviewVideo" autoplay muted loop playsinline hidden></video>
              <iframe id="editorPreviewIframe" allow="autoplay; encrypted-media" hidden></iframe>
              <div class="preview-empty" id="editorPreviewEmpty">이미지가 설정되지 않았습니다.</div>
            </div>
          </div>

          <!-- 4. 태그 · 스펙 · 링크 -->
          <div class="form-section">
            <h2 class="section-title">태그 · 스펙 · 링크</h2>

            <div class="field">
              <label for="tagInput">태그 (Enter 또는 쉼표로 추가)</label>
              <div class="tag-editor" id="tagEditor">
                <div class="tag-chips" id="tagChips"></div>
                <input type="text" id="tagInput" placeholder="예: macOS, Windows, Rust" />
              </div>
            </div>

            <div class="field">
              <div class="row-header">
                <label>스펙 정보</label>
                <button type="button" class="adm-btn small" id="addStatBtn">+ 추가</button>
              </div>
              <div class="dynamic-list" id="statsBuilder"></div>
            </div>

            <div class="field">
              <div class="row-header">
                <label>다운로드 / 실행 링크</label>
                <button type="button" class="adm-btn small" id="addLinkBtn">+ 추가</button>
              </div>
              <div class="dynamic-list" id="linksBuilder"></div>
            </div>
          </div>
        </form>
      </section>
    </div>
  </main>

  <!-- 사이트 설정 모달 -->
  <div class="liquid-modal-backdrop" id="settingsBackdrop" aria-hidden="true">
    <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-header">
        <h2 id="settingsTitle">사이트 설정</h2>
        <button class="icon-btn small" id="closeSettingsBtn" aria-label="닫기">✕</button>
      </div>
      <div class="settings-body">
        <div class="field">
          <label for="cfgBrandName">사이트 이름</label>
          <input type="text" id="cfgBrandName" class="adm-input" />
        </div>
        <div class="field">
          <label for="cfgHeroTitle">메인 제목</label>
          <input type="text" id="cfgHeroTitle" class="adm-input" />
        </div>
        <div class="field">
          <label for="cfgHeroSubtitle">부제목</label>
          <textarea id="cfgHeroSubtitle" class="adm-textarea" rows="2"></textarea>
        </div>
        <div class="field">
          <div class="row-header">
            <label>상단 링크</label>
            <button type="button" class="adm-btn small" id="addCfgLinkBtn">+ 추가</button>
          </div>
          <div class="dynamic-list" id="cfgLinksBuilder"></div>
        </div>
      </div>
      <div class="settings-footer">
        <button type="button" class="adm-btn primary" id="saveSettingsBtn">저장</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="./projects.js"></script>
  <script src="./media-store.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
